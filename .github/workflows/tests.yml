name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install openai google-genai httpx pytest
      - name: Run tests
        env:
          XAI_API_KEY: ""
          GOOGLE_API_KEY: ""
        run: python -m pytest
